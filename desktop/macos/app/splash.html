<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CVAT Desktop</title>
  <style>
    :root { color-scheme: dark; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #17191e; color: #f2f4f8; }
    main { width: min(440px, calc(100vw - 64px)); }
    h1 { font-size: 27px; font-weight: 650; margin: 0 0 8px; }
    p { color: #aeb6c4; line-height: 1.55; }
    #status { margin-top: 28px; min-height: 42px; color: #e4e8ef; }
    .track { height: 5px; border-radius: 9px; overflow: hidden; background: #343a45; }
    .track span { display: block; width: 28%; height: 100%; border-radius: inherit; background: #70a5ff; animation: pulse 1.7s ease-in-out infinite; }
    @keyframes pulse { 0% { transform: translateX(-110%); } 100% { transform: translateX(390%); } }
    small { display: block; color: #7e8999; margin-top: 26px; }
  </style>
</head>
<body>
  <main>
    <h1>CVAT Desktop</h1>
    <p>Starting your local annotation workspace. No Docker required.</p>
    <div class="track"><span></span></div>
    <p id="status" role="status">Preparing the desktop runtime…</p>
    <small>First launch downloads and installs the native runtime components.</small>
  </main>
  <script>
    window.cvatDesktop?.onStatus(({ message }) => {
      document.getElementById("status").textContent = message || "Starting…";
    });
  </script>
</body>
</html>
